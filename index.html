<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-box {
      width: 380px;
      background: #fff;
      padding: 35px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    /* Logo image */
    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h2 {
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-box {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-box label {
      display: block;
      color: #444;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .input-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-box input:focus {
      border-color: #667eea;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .options a {
      color: #667eea;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #5568d8;
    }

    .signup {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }

    .signup a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <!-- Your logo image -->
    <img src="logo.jpg" alt="Website Logo" class="logo">

    <h2>APEC</h2>
    <p class="subtitle">Login to your account</p>

    <form>

      <div class="input-box">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <p class="signup">
      Don't have an account?
      <a href="#">Sign Up</a>
    </p>

  </div>

</body>
</html>
